name: Invocation Contract Check

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, feat/**]

jobs:
  contract-l1-l4:
    name: Contract Test (L1 Frontmatter + L4 Deprecation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Self-contained: no npm install required (bkit runtime deps = 0).
      - name: Show working tree
        run: |
          ls -la
          echo "---"
          node --version

      - name: Domain Layer Purity Check (Sprint 5.5 — Clean Architecture enforcement)
        run: node scripts/check-domain-purity.js

      - name: L1+L4 vs v2.1.9 LTS baseline (long-term drift detection)
        run: node test/contract/scripts/contract-test-run.js --compare v2.1.9 --level L1,L4

      # v2.1.17: Dual baseline — Latest snapshot acts as noise floor for
      # immediate regression detection between minor releases. See
      # docs/06-guide/contract-baseline-rollforward.guide.md for rollforward SOP.
      - name: L1+L4 vs v2.1.16 Latest baseline (noise floor)
        run: node test/contract/scripts/contract-test-run.js --compare v2.1.16 --level L1,L4

      - name: Guard Registry validation
        run: node scripts/check-guards.js

      # v2.1.34: hooks.json must conform to the Claude Code hook specification.
      # Every defect this catches shipped in a release and survived a green
      # 6,398-assertion suite, because nothing validated the CONFIGURATION —
      # only that handlers existed, parsed, and behaved when invoked directly.
      # Covers: timeout unit and bounds (they were 1000x too large — `10000` on
      # Stop meant 2h46m, the real cause of issue #139), `once` placement,
      # one-rule-per-`if`, `if` only on tool events, event-name validity,
      # matcher support, handler resolution, and count parity with the SoT.
      - name: Hooks config contract (Claude Code hook spec conformance)
        run: node test/contract/hooks-config-contract.test.js

      # v2.1.34: every shipped shell script must parse. v2.1.33's flagship
      # live-QA harness was committed with a bash syntax error (an unquoted
      # heredoc expanded `$(` and `$0` at generation time) and was referenced by
      # nothing, so it could not be detected. `node --check` already covers .js.
      - name: Shipped shell scripts parse (bash -n + portability)
        run: node test/contract/shipped-scripts-parse.test.js

      # v2.1.17 (CO-7): detect untracked production test files. Defends
      # against silent .gitignore regression that previously masked CI-
      # referenced test files (Cannot find module errors).
      - name: Test File Tracking validation
        run: node scripts/check-test-tracking.js

      - name: Docs=Code cross-check (Sprint 4, ENH-241)
        run: node scripts/docs-code-sync.js

      - name: Dead code detection (Sprint 4.5 — prevent new dead code in v2.1.10+)
        run: node scripts/check-deadcode.js

      - name: Runtime Integration Tests (Sprint 4.5 — recursion guard + prod hook paths)
        run: node test/contract/integration-runtime.test.js

      # v2.1.17: L2 + L3 layer tests promoted from observational to mandatory.
      # 5/12 cleanup masked Agent removal because only L1+L4 ran in CI.
      # L2 = hook smoke + attribution, L3 = MCP static compat + runtime.
      - name: L2 Smoke (hook handler invocation)
        run: node test/contract/l2-smoke.test.js

      - name: L2 Hook Attribution (cc-regression + PreCompact counter)
        run: node test/contract/l2-hook-attribution.test.js

      - name: L3 MCP Compatibility (static schema)
        run: node test/contract/l3-mcp-compat.test.js

      - name: L3 MCP Runtime (stdio JSON-RPC lifecycle)
        run: node test/contract/l3-mcp-runtime.test.js

      # v2.1.34 — L6 host integration. Drives a REAL `claude -p --plugin-dir`
      # session and asserts from the outside that Claude Code actually dispatched
      # bkit's hooks, using the `.bkit/runtime/hook-dispatch.ndjson` ledger.
      #
      # L1-L5 all call bkit's own code; l2-smoke.test.js states outright that it
      # "does NOT require the real CC runtime". That is precisely why eight
      # shipped features could be dead in production while every test passed.
      #
      # Skips cleanly when the CLI is absent (the usual case on a stock runner),
      # so it costs seconds and never blocks a PR; it becomes a real gate wherever
      # the CLI and credentials exist. BKIT_REQUIRE_HOST_INTEGRATION=1 turns a
      # skip into a failure.
      - name: L6 Host Integration (hooks actually dispatch in a live session)
        run: node test/contract/host-integration/hook-dispatch.test.js

      # ENH-411 (v2.1.33) — layer 3 of 3: make the pipe preserve the exit code.
      # Without an explicit `shell:`, GitHub Actions runs steps under `bash -e`
      # WITHOUT pipefail, so the pipeline's status came from `tail` (always 0)
      # and a failing aggregate could never turn the job red. Naming `bash`
      # explicitly selects `bash --noprofile --norc -eo pipefail`, which
      # propagates qa-aggregate's exit code while keeping the output trimmed.
      - name: Aggregate all tests (summary)
        shell: bash
        run: |
          # `| tail -10` keeps the summary readable, but on a failure it also
          # discards every line naming what failed — the first red run under the
          # restored gate reported "14 failing assertion(s)" with no way to tell
          # which files. A gate that fails without saying why is only half a gate.
          # Keep the trimmed output on success; print the offenders on failure.
          set -o pipefail
          if node test/contract/scripts/qa-aggregate.js > /tmp/qa-agg.log 2>&1; then
            tail -10 /tmp/qa-agg.log
          else
            status=$?
            tail -12 /tmp/qa-agg.log
            echo ""
            echo "---- failing entries (file + assertion) ----"
            # Match the per-file markers AND the indented assertion lines printed
            # under them. `tail -200` is not enough: the per-file section is one
            # line per test file (350+), so a failure in the middle is cut off.
            grep -E '^(✗|⚠)|^[[:space:]]+(✗|FAIL:)' /tmp/qa-agg.log \
              || echo "(no per-file markers found)"
            echo ""
            echo "---- last 60 lines ----"
            tail -60 /tmp/qa-agg.log
            exit $status
          fi

      # ENH-411 (v2.1.33): lock the gating itself. This step fails if anyone
      # reintroduces a non-gating pipe, drops the aggregator's exit, or marks a
      # gate advisory again. It runs AFTER the aggregate so a genuine test
      # failure surfaces first and this one does not mask it.
      - name: CI Gating Contract (a failing test must be able to turn CI red)
        run: node test/contract/ci-gating-contract.test.js

      # v2.1.16 release-hardening: explicit release gate.
      # bkit-full-system verifies version-sync across README/hooks/manifests +
      # agent/skill structure. docs-code-sync detects counts drift between SoT
      # (lib/domain/rules/docs-code-invariants.js) and live filesystem.
      # Both were previously visible only via local `qa-aggregate` run; promoting
      # them to mandatory CI steps prevents v2.1.14/15/16-style release defects
      # where stale metadata shipped despite tests existing.
      - name: Release Gate — bkit-full-system (version sync + agent/skill structure)
        run: node tests/qa/bkit-full-system.test.js

      - name: Release Gate — docs-code-sync (counts SoT drift detector)
        run: node test/contract/docs-code-sync.test.js

      # v2.1.20 (F6 + ENH-322): plugin manifest 21-key whitelist validation.
      # Trigger: 외부 dogfooder 정병진 (@bj) 2026-05-26 install failure
      # (`Validation errors: : Unrecognized key: "displayName"` — CC ≤ v2.1.142
      # strict reject of the v2.1.143+ official displayName key).
      # Enforces lib/domain/rules/docs-code-invariants.js EXPECTED_PLUGIN_JSON_KEYS
      # SoT. Exit 2 on extra key, Exit 3 on SoT import failure. See ADR 0011.
      # v2.1.20: advisory only (continue-on-error: true) for 1 week.
      # v2.1.21+: strict (continue-on-error: false) — see CHANGELOG [2.1.21].
      - name: Release Gate — plugin.json schema validation (21-key whitelist)
        run: node scripts/validate-plugin.js --strict
        # v2.1.33 (ENH-411): the comment above has promised strict since v2.1.21,
        # but the value stayed `true` for 11 minor versions — the advisory window
        # closed long ago and the step verified nothing. Now strict, as designed.
        continue-on-error: false

  contract-l5-e2e:
    name: Contract Test L5 (Invocation Inventory)
    runs-on: ubuntu-latest
    needs: contract-l1-l4
    # v2.1.18 (CO-3): promoted from observational (continue-on-error: true)
    # to mandatory gate. Depends on contract-l1-l4 — only runs after L1+L4
    # passes (avoids redundant fail reports). invocation-inventory.test.js
    # baseline as of v2.1.25: 212 TC across skills/agents/hooks/MCP tools
    # (incl. deprecation-registry tombstone assertions, ADR 0014).
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: L5 Invocation Inventory (static surface verification)
        run: |
          if [ -f test/contract/invocation-inventory.test.js ]; then
            node test/contract/invocation-inventory.test.js
          else
            echo "ERROR: test/contract/invocation-inventory.test.js missing"
            exit 1
          fi
